services:
  db:
    image: postgres:15-alpine
    container_name: safeshift_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: safeshift
      POSTGRES_DB: safeshift_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: